version: 2
updates:
  # Mock origin image used by the e2e test
  - package-ecosystem: "docker-compose"
    directory: "/tests"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  # Playwright used by the e2e test
  - package-ecosystem: "pip"
    directory: "/tests"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  # Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
