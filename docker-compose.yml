name: yggdrasil-website-mirror

services:
  yggdrasil:
    image: ghcr.io/yggdrasil-network/yggdrasil-go:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - YGG_PRIV_KEY=${YGG_PRIV_KEY:?YGG_PRIV_KEY is required}
      - YGG_PEERS=${YGG_PEERS:?YGG_PEERS is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Generating base config..."
        mkdir -p /etc/yggdrasil
        yggdrasil -genconf > /etc/yggdrasil/yggdrasil.conf
        
        if [ -n "$$YGG_PRIV_KEY" ]; then
          echo "Syncing YGG_PRIV_KEY..."
          sed -i "s|^\s*PrivateKey:.*|  PrivateKey: $$YGG_PRIV_KEY|g" /etc/yggdrasil/yggdrasil.conf
        fi

        cat /etc/yggdrasil/yggdrasil.conf

        if [ -n "$$YGG_PEERS" ]; then
          echo "Syncing peers from YGG_PEERS..."
          LIST=""
          for p in $$YGG_PEERS; do
            LIST="$$LIST \"$$p\","
          done
          sed -i "s|Peers:\s*\[.*\]|Peers: [$$LIST]|g" /etc/yggdrasil/yggdrasil.conf
        fi
        
        exec yggdrasil -useconffile /etc/yggdrasil/yggdrasil.conf

  proxy:
    image: nginx:alpine
    network_mode: "service:yggdrasil"
    environment:
      - TARGET_DOMAIN=${TARGET_DOMAIN:?TARGET_DOMAIN is required}
      - ADDITIONAL_DOMAINS=${ADDITIONAL_DOMAINS:-}
    command: |
      sh -c '
      CACHE_CONF=/etc/nginx/conf.d/00-cache.conf
      cat <<EOF > $$CACHE_CONF
      proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=proxy_cache:10m max_size=100m inactive=60m use_temp_path=off;
      EOF

      CONF=/etc/nginx/conf.d/default.conf
      echo "" > $$CONF
      
      PORT=80
      rm -f /tmp/domain_map
      
      # Validate and normalize TARGET_DOMAIN
      if [ "$${TARGET_DOMAIN#http://}" != "$$TARGET_DOMAIN" ]; then
          TARGET_SCHEME="http"
          TARGET_HOST="$${TARGET_DOMAIN#http://}"
      elif [ "$${TARGET_DOMAIN#https://}" != "$$TARGET_DOMAIN" ]; then
          TARGET_SCHEME="https"
          TARGET_HOST="$${TARGET_DOMAIN#https://}"
      else
          echo "Error: TARGET_DOMAIN '$$TARGET_DOMAIN' is missing http:// or https:// scheme prefix." >&2
          exit 1
      fi

      case "$$TARGET_HOST" in
          *:*) TARGET_UP_HOST="$${TARGET_HOST%%:*}"; TARGET_UP_PORT="$${TARGET_HOST##*:}" ;;
          *) TARGET_UP_HOST="$$TARGET_HOST"; TARGET_UP_PORT=$$( [ "$$TARGET_SCHEME" = "http" ] && echo 80 || echo 443 ) ;;
      esac
      echo "$$TARGET_SCHEME $$TARGET_UP_HOST $$TARGET_UP_PORT $$PORT" >> /tmp/domain_map
      PORT=$$((PORT+1))

      # Process ADDITIONAL_DOMAINS
      for input_d in $$ADDITIONAL_DOMAINS; do
          if [ "$${input_d#http://}" != "$$input_d" ]; then
              UP_SCHEME="http"
              d="$${input_d#http://}"
          elif [ "$${input_d#https://}" != "$$input_d" ]; then
              UP_SCHEME="https"
              d="$${input_d#https://}"
          else
              echo "Error: Domain '$$input_d' in ADDITIONAL_DOMAINS is missing http:// or https:// scheme prefix." >&2
              exit 1
          fi
          
          case "$$d" in
              *:*) UP_HOST="$${d%%:*}"; UP_PORT="$${d##*:}" ;;
              *) UP_HOST="$$d"; UP_PORT=$$( [ "$$UP_SCHEME" = "http" ] && echo 80 || echo 443 ) ;;
          esac
          echo "$$UP_SCHEME $$UP_HOST $$UP_PORT $$PORT" >> /tmp/domain_map
          PORT=$$((PORT+1))
      done
      
      # Generate Nginx configuration for each domain
      while read UP_SCHEME DOMAIN UP_PORT D_PORT; do
          cat <<EOF >> $$CONF
      server {
          listen [::]:$$D_PORT $$( [ "$$D_PORT" = "80" ] && echo "default_server" );
          server_name _;
          
          location / {
              proxy_pass $$UP_SCHEME://$$DOMAIN:$$UP_PORT;
              proxy_set_header Host $$DOMAIN;
              proxy_ssl_server_name on;
              proxy_set_header X-Real-IP \$$remote_addr;
              proxy_set_header X-Forwarded-For \$$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$$scheme;
              proxy_set_header Accept-Encoding "";

              proxy_redirect https://$$DOMAIN/ /;
              proxy_redirect http://$$DOMAIN/ /;

              proxy_cache proxy_cache;
              proxy_cache_key \$$scheme\$$host\$$request_uri;
              proxy_cache_valid 200 301 302 10m;
              proxy_cache_valid 404 1m;
              proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
              proxy_cache_background_update on;
              proxy_cache_lock on;
              add_header X-Cache-Status \$$upstream_cache_status;

              sub_filter_once off;
              # * matches any MIME type, so direct links get rewritten regardless of response content type
              sub_filter_types *;
      EOF
      
          # Generate sub_filter rules for each domain mapping
          while read SUB_UP_SCHEME SUB_DOMAIN SUB_UP_PORT SUB_PORT; do
              if [ "$$SUB_PORT" = "80" ]; then
                  REPLACE="http://\$$host"
              else
                  REPLACE="http://\$$host:$$SUB_PORT"
              fi
              echo "        sub_filter \"$$SUB_UP_SCHEME://$$SUB_DOMAIN\" \"$$REPLACE\";" >> $$CONF
              # Also sub_filter the alternative scheme just in case the backend returns it
              ALT_SCHEME=$$( [ "$$SUB_UP_SCHEME" = "https" ] && echo "http" || echo "https" )
              echo "        sub_filter \"$$ALT_SCHEME://$$SUB_DOMAIN\" \"$$REPLACE\";" >> $$CONF

              # Bare "host" / "host:port" values (e.g. API JSON fields with no URL scheme) leak the real address too.
              # Match the longer host:port form first so it does not get clobbered by the bare-host rule below.
              PORT_MATCH=$$( [ "$$SUB_UP_SCHEME" = "https" ] && echo 443 || echo 80 )
              if [ "$$SUB_UP_PORT" != "$$PORT_MATCH" ]; then
                  echo "        sub_filter \"$$SUB_DOMAIN:$$SUB_UP_PORT\" \"\$$host:$$SUB_PORT\";" >> $$CONF
              fi
              echo "        sub_filter \"$$SUB_DOMAIN\" \"\$$host:$$SUB_PORT\";" >> $$CONF
          done < /tmp/domain_map
      
          cat <<EOF >> $$CONF
          }
      }
      EOF
      done < /tmp/domain_map
      
      echo "=== Generated Nginx Config ==="
      cat $$CONF
      
      exec nginx -g "daemon off;"'
    restart: unless-stopped
    depends_on:
      - yggdrasil
