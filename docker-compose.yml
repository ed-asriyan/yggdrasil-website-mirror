name: yggdrasil-website-mirror

services:
  yggdrasil:
    image: ghcr.io/yggdrasil-network/yggdrasil-go:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - YGG_PRIV_KEY=${YGG_PRIV_KEY:?YGG_PRIV_KEY is required}
      - YGG_PEERS=${YGG_PEERS:?YGG_PEERS is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Generating base config..."
        mkdir -p /etc/yggdrasil
        yggdrasil -genconf > /etc/yggdrasil/yggdrasil.conf
        
        if [ -n "$$YGG_PRIV_KEY" ]; then
          echo "Syncing YGG_PRIV_KEY..."
          sed -i "s|^\s*PrivateKey:.*|  PrivateKey: $$YGG_PRIV_KEY|g" /etc/yggdrasil/yggdrasil.conf
        fi

        cat /etc/yggdrasil/yggdrasil.conf

        if [ -n "$$YGG_PEERS" ]; then
          echo "Syncing peers from YGG_PEERS..."
          LIST=""
          for p in $$YGG_PEERS; do
            LIST="$$LIST \"$$p\","
          done
          sed -i "s|Peers:\s*\[.*\]|Peers: [$$LIST]|g" /etc/yggdrasil/yggdrasil.conf
        fi
        
        exec yggdrasil -useconffile /etc/yggdrasil/yggdrasil.conf

  proxy:
    image: nginx:alpine
    network_mode: "service:yggdrasil"
    environment:
      - TARGET_DOMAIN=${TARGET_DOMAIN:?TARGET_DOMAIN is required}
      - ADDITIONAL_DOMAINS=${ADDITIONAL_DOMAINS:-}
    command: |
      sh -c '
      CONF=/etc/nginx/conf.d/default.conf
      echo "" > $$CONF
      
      PORT=80
      rm -f /tmp/domain_map
      
      # Create a mapping of domains to ports
      for d in $$TARGET_DOMAIN $$ADDITIONAL_DOMAINS; do
          echo "$$d $$PORT" >> /tmp/domain_map
          PORT=$$((PORT+1))
      done
      
      # Generate Nginx configuration for each domain
      while read DOMAIN D_PORT; do
          cat <<EOF >> $$CONF
      server {
          listen [::]:$$D_PORT $$( [ "$$D_PORT" = "80" ] && echo "default_server" );
          server_name _;
          
          location / {
              proxy_pass https://$$DOMAIN;
              proxy_set_header Host $$DOMAIN;
              proxy_ssl_server_name on;
              proxy_set_header X-Real-IP \$$remote_addr;
              proxy_set_header X-Forwarded-For \$$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$$scheme;
              proxy_set_header Accept-Encoding "";

              proxy_redirect https://$$DOMAIN/ /;
              proxy_redirect http://$$DOMAIN/ /;

              sub_filter_once off;
              # Replace links not only in HTML but also in JSON/JS if the frontend dynamically constructs URLs
              sub_filter_types text/html application/json application/javascript;
      EOF
      
          # Generate sub_filter rules for each domain mapping
          while read SUB_DOMAIN SUB_PORT; do
              if [ "$$SUB_PORT" = "80" ]; then
                  REPLACE="http://\$$host"
              else
                  REPLACE="http://\$$host:$$SUB_PORT"
              fi
              echo "        sub_filter \"https://$$SUB_DOMAIN\" \"$$REPLACE\";" >> $$CONF
              echo "        sub_filter \"http://$$SUB_DOMAIN\" \"$$REPLACE\";" >> $$CONF
          done < /tmp/domain_map
      
          cat <<EOF >> $$CONF
          }
      }
      EOF
      done < /tmp/domain_map
      
      echo "=== Generated Nginx Config ==="
      cat $$CONF
      
      exec nginx -g "daemon off;"'
    restart: unless-stopped
    depends_on:
      - yggdrasil
